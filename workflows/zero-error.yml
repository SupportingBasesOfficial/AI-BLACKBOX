# AI Black Box v2 — CI/CD Workflow
# Runs ALL validators on PRs (supreme judge). Timeout: 10 minutes.
# Bimodal enforcement: local hooks can be bypassed, CI cannot.

name: AI Black Box v2 Validation

on:
  pull_request:
    branches: [main, develop, master]
  push:
    branches: [main, master]

jobs:
  ai-blackbox-validate:
    name: AI Black Box v2 — 100% Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then npm ci || npm install; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install AI Black Box dependencies
        run: |
          if [ -d .zero-error ]; then
            cd .zero-error && npm install --production 2>/dev/null || true
          fi

      - name: Install security tools
        run: |
          pip install semgrep gitleaks 2>/dev/null || true
          go install github.com/gitleaks/gitleaks/v8@latest 2>/dev/null || true

      - name: Verify integrity (immutable files)
        run: |
          if [ -f .zero-error/.integrity ]; then
            node --input-type=module -e "
              import('.zero-error/lib/integrity-guard.js').then(m => {
                const r = m.verifyIntegrity('.zero-error');
                if (!r.valid) {
                  console.error('INTEGRITY VIOLATION:');
                  r.violations.forEach(v => console.error('  - ' + v.file + ': ' + v.reason));
                  process.exit(1);
                }
                console.log('Integrity: OK');
              });
            "
          fi

      - name: Run AI Black Box validators (CI mode — supreme judge)
        run: |
          if [ -d .zero-error ]; then
            node .zero-error/validators/index.js ci
          else
            echo "AI Black Box v2: .zero-error/ not found. Skipping."
          fi

      - name: Upload AI Black Box report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-blackbox-report
          path: |
            zero-error-feedback.json
            coverage/
            .zero-error/.validator-cache.json
          retention-days: 7
